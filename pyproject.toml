[project]
name = "invoiceflow"
version = "0.1.0"
description = "Automated invoice processing with LLM extraction, validation, an eval harness and human review"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
