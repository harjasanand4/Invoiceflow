name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (Postgres, including the parallel-worker test)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      - name: Generate eval dataset
        run: python -m data.generate_invoices --count 80 --seed 42
      - name: Eval gate
        # Fails the build if extraction gets worse or anything wrong gets auto-approved.
        # The rules extractor needs no API key. To gate the LLM too, add ANTHROPIC_API_KEY
        # as a repository secret and run a second step with --extractor hybrid.
        run: >
          python -m evals.run_eval --extractor rules
          --min-field-accuracy 0.80
          --min-error-recall 0.80
          --min-auto-approved-precision 0.95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t invoiceflow .
